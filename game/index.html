<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starfall Pact — a card duel beneath falling stars</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <main id="table">
    <header id="topbar">
      <span id="brand">★ STARFALL PACT</span>
      <span id="turn-label">Your turn</span>
      <button id="mute" title="Toggle sound">🔊</button>
    </header>

    <section id="rival-zone">
      <div id="rival-banner"></div>
      <div id="rival-hand" aria-label="Vesper's hand, face down"></div>
    </section>
    <div id="rival-field" class="field" aria-label="Vesper's spirits"></div>

    <section id="centre-row">
      <div id="log" aria-label="Recent events"></div>
      <div id="centre-stack">
        <div id="starlight" aria-label="Your starlight"></div>
        <div id="hint"></div>
      </div>
      <button id="end-turn">End Turn ➜</button>
    </section>

    <div id="your-field" class="field" aria-label="Your spirits"></div>
    <section id="your-zone">
      <div id="your-banner"></div>
      <div id="your-hand" aria-label="Your hand"></div>
    </section>
  </main>
  <div id="overlay" class="hidden"></div>
  <p id="status" role="status" aria-live="polite"></p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
